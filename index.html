<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سجل العمالة</title>
    <style>
          /* بيانات الوحدة */
    .room .tags { display: block; font-size: 12px; margin-top: 4px; }
    #roomInfo { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: white; padding: 12px 15px; border-radius: 12px; margin-bottom: 12px; }
    #roomInfo:empty { display: none; }
    #roomInfo label { display: inline-flex; gap: 6px; align-items: center; }
          /* نافذة الإضافة */
    #addBox { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 15px; }
    #addBox[hidden] { display: none; }
    #addInner { background: white; border-radius: 12px; padding: 20px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
          /* نافذة الملف الشخصي */
    #profileBox { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 15px; }
    #profileBox[hidden] { display: none; }
    #profileBox #profile { width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; margin: 0; }
          /* نافذة التعديل */
    #editBox { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 15px; }
    #editBox[hidden] { display: none; }
    #editForm { background: white; border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; display: grid; gap: 10px; }
    #editForm label { display: grid; gap: 4px; font-size: 14px; color: #475569; }
          /* مربعات الغرف */
    #buildingTabs { display: flex; gap: 10px; margin-bottom: 10px; }
    #roomsGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: 15px; }
    .room { background: white; border: 2px solid #cbd5e1; border-radius: 10px; padding: 10px 5px; text-align: center; cursor: pointer; }
    .room b { display: block; font-size: 18px; color: #1e3a5f; }
    .room small { color: #64748b; }
    .room:hover, .room.active { border-color: #e08a1e; background: #fff7ed; }
          /* كروت الأرقام */
    #stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat { background: white; padding: 15px; border-radius: 12px; text-align: center; }
    .stat b { display: block; font-size: 28px; color: #1e3a5f; }

    /* الجدول */
    #workersList > div { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    td b { font-size: 13px; }    th { color: #64748b; font-size: 13px; }
    td button { padding: 6px 10px; font-size: 13px; }

    /* العلامات الملوّنة */
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 13px; }
    .ok { background: #dcfce7; color: #166534; }
    .bad { background: #fee2e2; color: #991b1b; }
    .miss { background: #e2e8f0; color: #475569; }
          #filterBox { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    #search { flex: 1; min-width: 200px; }
          /* صورة الإقامة */
    #iqamaPreview, .iqama-img {
      max-width: 300px;
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid #cbd5e1;
    }
       
    /* شكل الصفحة كلها */
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #eef1f5;
      color: #1f2937;
            max-width: 1300px;;
      margin: 0 auto;
      padding: 20px;
    }

    /* العنوان الكبير */
    h1 {
      background: #1e3a5f;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    /* العناوين الصغيرة */
    h2 {
      color: #1e3a5f;
      border-right: 5px solid #e08a1e;
      padding-right: 10px;
      margin-top: 35px;
    }

    /* فورم الإضافة */
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    /* الخانات */
        input, select {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

      input:focus, select:focus {
      outline: none;
      border-color: #e08a1e;
    }

    /* الزراير */
    button {
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      background: #e08a1e;
    }

    /* كروت العمال والحضور والملف الشخصي */
    #workersList > div,
    #attendanceList > div,
    #profile {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      line-height: 1.9;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    /* نخفي الخطوط الفاصلة لأن الكروت كفاية */
    hr {
      display: none;
    }

    #attendanceList button {
      margin: 0 4px;
    }

    /* الملف الشخصي */
    #profile h3 {
      margin-top: 0;
      color: #e08a1e;
      font-size: 22px;
    }

    #profile h4 {
      background: #eef1f5;
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <h1>سجل العمالة</h1>
  
  <!-- شاشة تسجيل الدخول -->
    <div id="loginBox">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="الإيميل" required>
      <input id="loginPassword" type="password" placeholder="الباسورد" required>
      <button type="submit">دخول</button>
    </form>
    <p id="loginMsg"></p>
  </div>

  <!-- البرنامج نفسه (مخفي لحد ما تسجل دخول) -->
  <div id="app" hidden>
    <button onclick="logout()" style="background:#c0392b">🚪 تسجيل خروج</button>
  <button onclick="openAdd()" style="background:#16a34a">➕ إضافة ساكن</button>
  <div id="addBox" hidden onclick="if (event.target === this) closeAdd()">
  <div id="addInner">
  
    <h2>إضافة عامل جديد</h2>
   <div id="scanBox">
        <button type="button" onclick="openCamera()">📷 صوّر الإقامة</button>
    <button type="button" onclick="document.getElementById('iqamaFile').click()">🖼️ اختار صورة</button>
    <input type="file" id="iqamaCamera" accept="image/*" capture="environment" onchange="scanIqama(this)" hidden>
    <input type="file" id="iqamaFile" accept="image/*" onchange="scanIqama(this)" hidden>
    <p>💡 حط الإقامة على سطح غامق، في نور كويس، وقرّب لحد ما الكارت يملا الصورة.</p>

    <span id="scanStatus"></span>
        <br><img id="iqamaPreview" hidden>
  </div>
  <form id="workerForm">
    <input id="name" placeholder="اسم العامل" required>
        <input id="idNo" placeholder="رقم الإقامة">
    <select id="country">
      <option value="">اختار البلد</option>
      <option>هندي</option>
      <option>بنجلاديشي</option>
      <option>نيبالي</option>
      <option>باكستاني</option>
      <option>مصري</option>
      <option>يمني</option>
      <option>فلبيني</option>
    </select>

    
    <input id="room" placeholder="رقم الغرفة">
        <select id="building">
      <option>السكن الأول</option>
      <option>السكن الثاني</option>
    </select>
    <input id="bedNo" type="number" placeholder="رقم السرير">
    <input id="job" placeholder="المهنة">
    <input id="sponsor" list="sponsorList" placeholder="الكفيل">
    <label>تاريخ القدوم <input id="arrival" type="date"></label>
    <select id="blanket">
      <option value="لا">لم يستلم بطانية</option>
      <option value="نعم">استلم بطانية</option>
    </select>
    
    <button type="submit">إضافة</button>
  </form>
  <button type="button" onclick="closeAdd()" style="background:#c0392b">إلغاء</button>
  </div>
  </div>
  <h2>قائمة العمال</h2>
      <div id="stats"></div>
        <div id="buildingTabs">
    <button onclick="openBuilding('السكن الأول')">🏢 السكن الأول</button>
    <button onclick="openBuilding('السكن الثاني')">🏢 السكن الثاني</button>
  </div>
  <div id="roomsGrid"></div>
    <div id="roomInfo"></div>
  <div id="filterBox">
        <input id="search" placeholder="ابحث بالاسم أو الإقامة أو الغرفة" oninput="currentRoom = ''; showRooms(); showWorkers()">
    <select id="filterBuilding" onchange="showWorkers()">
      <option value="">كل المساكن</option>
      <option>السكن الأول</option>
      <option>السكن الثاني</option>
    </select>
    <b id="resultCount"></b>
        <button onclick="exportExcel()" style="background:#16a34a">📊 تصدير Excel</button>
  </div>
  <div id="workersList"></div>
       
   
   <div id="cameraBox" hidden>
    <div id="cameraWrap">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div id="cameraFrame"></div>
    </div>
    <p>حط الإقامة جوه الإطار البرتقالي</p>
    <button type="button" onclick="takePhoto()">📸 التقط الصورة</button>
    <button type="button" onclick="closeCamera()" style="background:#c0392b">إلغاء</button>
  </div>
   <div id="profileBox" hidden onclick="if (event.target === this) closeProfile()">
    <div id="profile"></div>
  </div>
     <datalist id="sponsorList">
    <option value="TDC">
    <option value="Local Rental">
    <option value="Contract Rental">
    <option value="Talent House">
    <option value="Saudi Reliance">
    <option value="Alfauj">
  </datalist>
  <div id="editBox" hidden>
    <form id="editForm">
      <h3>✏️ تعديل بيانات ساكن</h3>
      <label>الاسم <input id="e_name" required></label>
      <label>رقم الإقامة <input id="e_idNo"></label>
      <label>البلد <select id="e_country"></select></label>
      <label>اللغة <select id="e_language"></select></label>
      <label>السكن
        <select id="e_building">
          <option>السكن الأول</option>
          <option>السكن الثاني</option>
        </select>
      </label>
      <label>الغرفة <input id="e_room"></label>
      <label>السرير <input id="e_bed" type="number"></label>
      <label>المهنة <input id="e_job"></label>
            <label>الكفيل <input id="e_sponsor" list="sponsorList"></label>
      <label>البطانية
        <select id="e_blanket">
          <option value="لا">لم يستلم</option>
          <option value="نعم">استلم</option>
        </select>
      </label>
      <label>صورة الإقامة (اختياري) <input id="e_img" type="file" accept="image/*"></label>
      <div>
        <button type="submit">💾 حفظ</button>
        <button type="button" onclick="closeEdit()" style="background:#c0392b">إلغاء</button>
      </div>
      <p id="editMsg"></p>
    </form>
  </div>
</div> <!-- نهاية app -->
    <script>
          // 0. الاتصال بـ Supabase
        const SUPABASE_URL = "https://xbckfzqifaywhrpuqkyo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FyUepLOGo7wUTpj7cdSZsg_TXi1r8bl";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // إظهار البرنامج وإخفاء شاشة الدخول
    function showApp() {
      document.getElementById("loginBox").hidden = true;
      document.getElementById("app").hidden = false;
            loadWorkers();
                  loadRooms();
    }

    // تسجيل الدخول
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const msg = document.getElementById("loginMsg");
      msg.textContent = "⏳ جاري الدخول...";

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value
      });

      if (error) {
        msg.textContent = "❌ الإيميل أو الباسورد غلط";
        return;
      }
      msg.textContent = "";
      showApp();
    });

    // تسجيل الخروج
    async function logout() {
      await db.auth.signOut();
      location.reload();
    }

    // لو مسجّل دخول من قبل، افتح البرنامج على طول
    db.auth.getSession().then(function ({ data }) {
      if (data.session) showApp();
    });
    // 1. نجيب العمال المحفوظين، ولو مفيش نبدأ بقائمة فاضية
    let workers = [];

    // نجيب العمال من Supabase
    async function loadWorkers() {
      const { data, error } = await db.from("workers").select("*").order("building").order("room").order("bed_no");
      if (error) {
        alert("❌ مشكلة في تحميل العمال: " + error.message);
        return;
      }
      workers = data.map(w => ({ ...w, idNo: w.id_no, iqamaImg: w.iqama_img }));
      showWorkers();
    }

    // 2. دالة بتعرض العمال في الصفحة
          // كروت الأرقام
    function showStats() {
      const b1 = workers.filter(w => w.building === "السكن الأول").length;
      const b2 = workers.filter(w => w.building === "السكن الثاني").length;
      const blanket = workers.filter(w => w.blanket === "نعم").length;
      const noImg = workers.filter(w => !w.iqamaImg).length;

      document.getElementById("stats").innerHTML = `
        <div class="stat"><b>${workers.length}</b>إجمالي الساكنين</div>
        <div class="stat"><b>${b1}</b>السكن الأول</div>
        <div class="stat"><b>${b2}</b>السكن الثاني</div>
        <div class="stat"><b>${blanket}</b>استلموا بطانية</div>
        <div class="stat"><b style="color:#c0392b">${noImg}</b>بدون صورة إقامة</div>
      `;
    }
          // مربعات الغرف
    let currentBuilding = "";
    let currentRoom = "";
        let lastResult = [];
            let roomsInfo = {};
    function openBuilding(name) {
      currentBuilding = name;
            currentRoom = "";
      document.getElementById("filterBuilding").value = name;
      document.getElementById("search").value = "";
      showRooms();
            showRoomInfo("");
      showWorkers();
    }

    function showRooms(activeRoom) {
      const grid = document.getElementById("roomsGrid");
      if (!currentBuilding) { grid.innerHTML = ""; return; }

      // نعدّ الساكنين في كل غرفة
      const rooms = {};
      workers.filter(w => w.building === currentBuilding).forEach(function (w) {
        rooms[w.room] = (rooms[w.room] || 0) + 1;
      });

      // نرتّب الغرف: 101، 102، ... 101A، 102A
      const names = Object.keys(rooms).sort((a, b) => a.localeCompare(b, "en", { numeric: true }));

      grid.innerHTML = names.map(r => `
        <div class="room ${r === activeRoom ? "active" : ""}" onclick="openRoom('${r}')">
          <b>${r}</b><small>${rooms[r]} ساكن</small>
          <small class="tags">${roomTags(r)}</small>
          </div>`).join("");
    }

    function openRoom(room) {
          currentRoom = room;
      document.getElementById("search").value = "";
      showRooms(room);
            showRoomInfo(room);
      showWorkers();
      document.getElementById("workersList").scrollIntoView({ behavior: "smooth" });
    }
       function showWorkers() {
      const list = document.getElementById("workersList");
      const q = document.getElementById("search").value.trim().toLowerCase();
      const b = document.getElementById("filterBuilding").value;

      // نختار العمال اللي مطابقين البحث والسكن
      const result = workers.filter(function (w) {
        if (b && w.building !== b) return false;
                if (currentRoom && w.room !== currentRoom) return false;
        if (!q) return true;
        const text = (w.name + " " + (w.idNo || "") + " " + (w.room || "")).toLowerCase();
        return text.includes(q);
      });

           lastResult = result;
      document.getElementById("resultCount").textContent = "العدد: " + result.length;

      if (result.length === 0) {
        list.innerHTML = "<p>لا يوجد نتائج</p>";
        return;
      }

            let html = `<div><table>
        <tr><th>#</th><th>الاسم</th>><th>الغرفة</th><th>السرير</th><th>الإقامة</th><th>الجنسية</th><th>المهنة</th><th>البطانية</th><th>صورة الإقامة</th><th></th></tr>`;

      result.slice(0, 50).forEach(function (worker, i) {
        html += `<tr>
          <td>${i + 1}</td>
          <td><b>${worker.name}</b></td>
                    <td>${worker.room || "-"}</td>
          <td>${worker.bed_no || "-"}</td>
          <td>${worker.idNo || "-"}</td>
          <td>${worker.country || "-"}</td>
          <td>${worker.job || "-"}</td>
          <td>${worker.blanket === "نعم" ? '<span class="badge ok">استلم</span>' : '<span class="badge bad">لم يستلم</span>'}</td>
          <td>${worker.iqamaImg ? '<span class="badge ok">موجودة</span>' : '<span class="badge miss">ناقصة</span>'}</td>
          <td>
                       <button onclick="openEdit(${worker.id})" style="background:#e08a1e">تعديل</button>
            <button onclick="showProfile(${worker.id})">الملف</button>
            <button onclick="deleteWorker(${worker.id})" style="background:#c0392b">حذف</button>
          </td>
        </tr>`;
      });

      html += `</table></div>`;
      if (result.length > 50) {
        html += `<p>معروض أول 50 من ${result.length}. اكتب في البحث عشان تضيّق النتيجة.</p>`;
      }
      list.innerHTML = html;
    }
    // 3. لما ندوس زرار "إضافة"
    document.getElementById("workerForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const form = event.target;

      const worker = {
        name: document.getElementById("name").value,
        id_no: document.getElementById("idNo").value,
        country: document.getElementById("country").value,
       
        room: document.getElementById("room").value,
        arrival: document.getElementById("arrival").value || null,
                blanket: document.getElementById("blanket").value,
        building: document.getElementById("building").value,
        bed_no: Number(document.getElementById("bedNo").value) || null,
        job: document.getElementById("job").value,
        sponsor: document.getElementById("sponsor").value
      };

            // رفع صورة الإقامة لو موجودة
      if (lastIqamaImage) {
        const blob = await (await fetch(lastIqamaImage)).blob();
        const path = Date.now() + ".jpg";
        const { error: upErr } = await db.storage.from("iqama").upload(path, blob, { contentType: "image/jpeg" });
        if (upErr) {
          alert("❌ الصورة مترفعتش: " + upErr.message);
          return;
        }
        worker.iqama_img = path;
      }
      
      const { error } = await db.from("workers").insert(worker);
      if (error) {
        alert("❌ العامل متحفظش: " + error.message);
        return;
      }

      form.reset();
            closeAdd();
      lastIqamaImage = "";
      document.getElementById("iqamaPreview").hidden = true;
      loadWorkers();
    });
    
       // 6. الملف الشخصي (بيانات السكن)
           // 6. الملف الشخصي (نافذة)
    async function showProfile(workerId) {
      const w = workers.find(x => x.id === workerId);

      let imgUrl = "";
      if (w.iqamaImg) {
        const { data } = await db.storage.from("iqama").createSignedUrl(w.iqamaImg, 3600);
        if (data) imgUrl = data.signedUrl;
      }

      document.getElementById("profile").innerHTML = `
        <h3>${w.name}</h3>
        ${imgUrl ? `<img src="${imgUrl}" class="iqama-img"><br>` : '<span class="badge miss">صورة الإقامة ناقصة</span><br>'}
        رقم الإقامة: ${w.idNo || "-"}<br>
        البلد: ${w.country || "-"}<br>
       
        المهنة: ${w.job || "-"}<br>
        الكفيل: ${w.sponsor || "-"}<br>
       
        <h4>بيانات السكن</h4>
        السكن: ${w.building || "-"}<br>
        الغرفة: ${w.room || "-"} | السرير: ${w.bed_no || "-"}<br>
        تاريخ القدوم: ${w.arrival || "-"}<br>
        البطانية: ${w.blanket === "نعم" ? '<span class="badge ok">استلم</span>' : '<span class="badge bad">لم يستلم</span>'}
        <br><br>
        <button onclick="closeProfile(); openEdit(${w.id})" style="background:#e08a1e">✏️ تعديل</button>
        <button onclick="closeProfile()" style="background:#64748b">إغلاق</button>
      `;
      document.getElementById("profileBox").hidden = false;
    }

    function closeProfile() {
      document.getElementById("profileBox").hidden = true;
    }
     
    
    // 7. النسخة الاحتياطية: حفظ البيانات في ملف
    function exportData() {
      const data = { workers: workers };
      const text = JSON.stringify(data);
      const file = new Blob([text], { type: "application/json" });

      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = "backup-" + new Date().toISOString().slice(0, 10) + ".json";
      link.click();
    }

    // استرجاع البيانات من ملف
    function importData(input) {
      const file = input.files[0];
      if (!file) return;

      if (!confirm("البيانات الحالية هتتبدّل بالبيانات اللي في الملف. متأكد؟")) {
        input.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function () {
        const data = JSON.parse(reader.result);
        workers = data.workers || [];
        localStorage.setItem("workers", JSON.stringify(workers));
        showWorkers();
              showStats();
                    showRooms();
                               input.value = "";
        alert("تم استرجاع البيانات بنجاح ✅");
      };
      reader.readAsText(file);
    }
      // 8. قراءة صورة الإقامة
    const countries = {
      "هندي": ["الهند", "INDIA"],
      "بنجلاديشي": ["بنجلاديش", "بنغلاديش", "BANGLADESH"],
      "نيبالي": ["نيبال", "NEPAL"],
      "باكستاني": ["باكستان", "PAKISTAN"],
      "مصري": ["مصر", "EGYPT"],
      "يمني": ["اليمن", "YEMEN"],
      "فلبيني": ["الفلبين", "PHILIPPINES"]
    };
    // الصورة الأخيرة اللي اتقرت
    let lastIqamaImage = "";

    // تصغير الصورة عشان متاخدش مساحة كبيرة
    function resizeImage(file) {
      return new Promise(function (resolve) {
        const img = new Image();
        img.onload = function () {
          const scale = Math.min(1, 800 / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = URL.createObjectURL(file);
      });
    }
    async function scanIqama(input) {
      const file = input.files[0];
      if (!file) return;
      
      lastIqamaImage = await resizeImage(file);
      const preview = document.getElementById("iqamaPreview");
      preview.src = lastIqamaImage;
      preview.hidden = false;

      const status = document.getElementById("scanStatus");
      status.textContent = "⏳ جاري قراءة الصورة... استنى شوية";

      try {
        const result = await Tesseract.recognize(file, "ara+eng");
        const text = result.data.text;
        console.log(text);

        // رقم الإقامة: 10 أرقام بتبدأ بـ 2
        const idMatch = text.match(/2\d{9}/);
        if (idMatch) {
          document.getElementById("idNo").value = idMatch[0];
}
                // الاسم: أطول سطر فيه حروف إنجليزي كبيرة
        const ignore = ["KINGDOM", "SAUDI", "ARABIA", "MINISTRY", "INTERIOR", "RESIDENT", "IDENTITY", "PERMIT"];
        let bestName = "";

        text.split("\n").forEach(function (line) {
          const clean = line
            .replace(/[^A-Z ]/g, "")
            .split(" ")
            .filter(w => w.length >= 2)
            .join(" ");

          const isIgnored = ignore.some(w => clean.includes(w));
          const words = clean.split(" ").length;

          if (!isIgnored && words >= 2 && clean.length > bestName.length) {
            bestName = clean;
          }
        });

        if (bestName) {
          document.getElementById("name").value = bestName;
        }
        
       

        // البلد
        const upperText = text.toUpperCase();
        for (const key in countries) {
          if (countries[key].some(w => upperText.includes(w))) {
            document.getElementById("country").value = key;
          }
        }

        status.textContent = "✅ خلصت القراءة، راجع البيانات قبل ما تدوس إضافة";
      } catch (error) {
        status.textContent = "❌ معرفتش أقرا الصورة، اتأكد إنك متصل بالإنترنت";
      }

      input.value = "";
    }
    
        // 10. الكاميرا بإطار
    let cameraStream = null;

    async function openCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        document.getElementById("cameraVideo").srcObject = cameraStream;
        document.getElementById("cameraBox").hidden = false;
      } catch (e) {
        alert("❌ الكاميرا مفتحتش. اسمح للموقع يستخدم الكاميرا، أو استخدم زرار اختار صورة");
      }
    }

    function closeCamera() {
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
      document.getElementById("cameraBox").hidden = true;
    }

    function takePhoto() {
      const video = document.getElementById("cameraVideo");
      const v = video.getBoundingClientRect();
      const f = document.getElementById("cameraFrame").getBoundingClientRect();
      const scale = video.videoWidth / v.width;

      const canvas = document.createElement("canvas");
      canvas.width = f.width * scale;
      canvas.height = f.height * scale;
      canvas.getContext("2d").drawImage(
        video,
        (f.left - v.left) * scale, (f.top - v.top) * scale, canvas.width, canvas.height,
        0, 0, canvas.width, canvas.height
      );

      closeCamera();
      canvas.toBlob(function (blob) {
        scanIqama({ files: [blob], value: "" });
      }, "image/jpeg", 0.92);
    }
    
        // 9. حذف عامل
    async function deleteWorker(workerId) {
      const worker = workers.find(w => w.id === workerId);
      if (!confirm("متأكد إنك عايز تحذف " + worker.name + "؟")) return;

      const { error } = await db.from("workers").delete().eq("id", workerId);
      if (error) {
        alert("❌ محصلش حذف: " + error.message);
        return;
      }
      if (worker.iqamaImg) await db.storage.from("iqama").remove([worker.iqamaImg]);
     
      document.getElementById("profile").innerHTML = "اختار عامل من القائمة لعرض ملفه";
      loadWorkers();
            loadRooms();
    }
       // 11. تعديل ساكن
    let editingId = null;

    function openEdit(id) {
      const w = workers.find(x => x.id === id);
      editingId = id;

      // ننسخ قوائم البلد واللغة من فورم الإضافة
           document.getElementById("e_country").innerHTML = document.getElementById("country").innerHTML;
      document.getElementById("e_name").value = w.name || "";
      document.getElementById("e_idNo").value = w.idNo || "";
      document.getElementById("e_country").value = w.country || "";
      document.getElementById("e_building").value = w.building || "السكن الأول";
      document.getElementById("e_room").value = w.room || "";
      document.getElementById("e_bed").value = w.bed_no || "";
      document.getElementById("e_job").value = w.job || "";
      document.getElementById("e_sponsor").value = w.sponsor || "";
      document.getElementById("e_blanket").value = w.blanket || "لا";
      document.getElementById("e_img").value = "";
      document.getElementById("editMsg").textContent = "";
      document.getElementById("editBox").hidden = false;
    }

    function closeEdit() {
      document.getElementById("editBox").hidden = true;
      editingId = null;
    }

    document.getElementById("editForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const msg = document.getElementById("editMsg");
      msg.textContent = "⏳ جاري الحفظ...";

      const changes = {
        name: document.getElementById("e_name").value,
        id_no: document.getElementById("e_idNo").value,
        country: document.getElementById("e_country").value,
        language: document.getElementById("e_language").value,
        building: document.getElementById("e_building").value,
        room: document.getElementById("e_room").value.trim().toUpperCase(),
        bed_no: Number(document.getElementById("e_bed").value) || null,
        job: document.getElementById("e_job").value,
         sponsor: document.getElementById("e_sponsor").value,
        blanket: document.getElementById("e_blanket").value
      };

      // لو اختار صورة إقامة جديدة، نصغّرها ونرفعها
      const file = document.getElementById("e_img").files[0];
      if (file) {
        const small = await resizeImage(file);
        const blob = await (await fetch(small)).blob();
        const path = Date.now() + ".jpg";
        const { error: upErr } = await db.storage.from("iqama").upload(path, blob, { contentType: "image/jpeg" });
        if (upErr) { msg.textContent = "❌ الصورة مترفعتش: " + upErr.message; return; }

        // نمسح الصورة القديمة لو موجودة
        const old = workers.find(x => x.id === editingId);
        if (old && old.iqamaImg) await db.storage.from("iqama").remove([old.iqamaImg]);
        changes.iqama_img = path;
      }

      const { error } = await db.from("workers").update(changes).eq("id", editingId);
      if (error) { msg.textContent = "❌ محصلش حفظ: " + error.message; return; }

      closeEdit();
      loadWorkers();
    });
       // 12. نافذة الإضافة
    function openAdd() {
      document.getElementById("addBox").hidden = false;
      if (currentBuilding) document.getElementById("building").value = currentBuilding;
      if (currentRoom) document.getElementById("room").value = currentRoom;
    }

    function closeAdd() {
      document.getElementById("addBox").hidden = true;
    }
        // 13. تصدير Excel
    function exportExcel() {
      if (lastResult.length === 0) {
        alert("مفيش بيانات للتصدير");
        return;
      }

      const rows = lastResult.map((w, i) => ({
        "#": i + 1,
        "الاسم": w.name,
        "رقم الإقامة": w.idNo || "",
        "الجنسية": w.country || "",
        "السكن": w.building || "",
        "الغرفة": w.room || "",
        "السرير": w.bed_no || "",
        "المهنة": w.job || "",
        "الكفيل": w.sponsor || "",
        "تاريخ القدوم": w.arrival || "",
        "البطانية": w.blanket === "نعم" ? "استلم" : "لم يستلم",
        "صورة الإقامة": w.iqamaImg ? "موجودة" : "ناقصة"
      }));

      const sheet = XLSX.utils.json_to_sheet(rows);
      const book = XLSX.utils.book_new();
      book.Workbook = { Views: [{ RTL: true }] };
      XLSX.utils.book_append_sheet(book, sheet, "الساكنين");
      XLSX.writeFile(book, "سكن-" + new Date().toISOString().slice(0, 10) + ".xlsx");
    }
       // 14. بيانات الوحدات (غرف، حمامات، مطبخ)
    async function loadRooms() {
      const { data, error } = await db.from("rooms").select("*");
      if (error) return;
      roomsInfo = {};
      data.forEach(r => roomsInfo[r.building + "|" + r.room] = r);
      showRooms(currentRoom);
    }

    function roomTags(room) {
      const info = roomsInfo[currentBuilding + "|" + room];
      if (!info) return "";
      return "🛏️" + info.bedrooms + " 🚿" + info.bathrooms + (info.kitchen ? " 🍳" : "");
    }

    function showRoomInfo(room) {
      const box = document.getElementById("roomInfo");
      if (!room) { box.innerHTML = ""; return; }
      const info = roomsInfo[currentBuilding + "|" + room] || { bedrooms: 1, bathrooms: 1, kitchen: false };

      box.innerHTML = `
        <b>وحدة ${room}</b>
        <label>الغرف
          <select id="r_bed">${[1, 2, 3].map(n => `<option ${n == info.bedrooms ? "selected" : ""}>${n}</option>`).join("")}</select>
        </label>
        <label>الحمامات
          <select id="r_bath">${[1, 2].map(n => `<option ${n == info.bathrooms ? "selected" : ""}>${n}</option>`).join("")}</select>
        </label>
        <label><input type="checkbox" id="r_kitchen" ${info.kitchen ? "checked" : ""}> مطبخ</label>
        <button onclick="saveRoomInfo('${room}')">💾 حفظ</button>
      `;
    }

    async function saveRoomInfo(room) {
      const row = {
        building: currentBuilding,
        room: room,
        bedrooms: Number(document.getElementById("r_bed").value),
        bathrooms: Number(document.getElementById("r_bath").value),
        kitchen: document.getElementById("r_kitchen").checked
      };
      const { error } = await db.from("rooms").upsert(row);
      if (error) { alert("❌ محصلش حفظ: " + error.message); return; }
      roomsInfo[currentBuilding + "|" + room] = row;
      showRooms(room);
    }
    // 4. أول ما الصفحة تفتح، اعرض العمال
    showWorkers();
      
  </script>
