<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سجل العمالة</title>
    <style>
          /* كروت الأرقام */
    #stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat { background: white; padding: 15px; border-radius: 12px; text-align: center; }
    .stat b { display: block; font-size: 28px; color: #1e3a5f; }

    /* الجدول */
    #workersList > div { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: right; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    th { color: #64748b; font-size: 13px; }
    td button { padding: 6px 10px; font-size: 13px; }

    /* العلامات الملوّنة */
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 13px; }
    .ok { background: #dcfce7; color: #166534; }
    .bad { background: #fee2e2; color: #991b1b; }
    .miss { background: #e2e8f0; color: #475569; }
          #filterBox { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    #search { flex: 1; min-width: 200px; }
          /* صورة الإقامة */
    #iqamaPreview, .iqama-img {
      max-width: 300px;
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid #cbd5e1;
    }
       
    /* شكل الصفحة كلها */
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #eef1f5;
      color: #1f2937;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* العنوان الكبير */
    h1 {
      background: #1e3a5f;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    /* العناوين الصغيرة */
    h2 {
      color: #1e3a5f;
      border-right: 5px solid #e08a1e;
      padding-right: 10px;
      margin-top: 35px;
    }

    /* فورم الإضافة */
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    /* الخانات */
        input, select {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

      input:focus, select:focus {
      outline: none;
      border-color: #e08a1e;
    }

    /* الزراير */
    button {
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      background: #e08a1e;
    }

    /* كروت العمال والحضور والملف الشخصي */
    #workersList > div,
    #attendanceList > div,
    #profile {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      line-height: 1.9;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    /* نخفي الخطوط الفاصلة لأن الكروت كفاية */
    hr {
      display: none;
    }

    #attendanceList button {
      margin: 0 4px;
    }

    /* الملف الشخصي */
    #profile h3 {
      margin-top: 0;
      color: #e08a1e;
      font-size: 22px;
    }

    #profile h4 {
      background: #eef1f5;
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

  <h1>سجل العمالة</h1>
  
  <!-- شاشة تسجيل الدخول -->
  <div id="loginBox">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="الإيميل" required>
      <input id="loginPassword" type="password" placeholder="الباسورد" required>
      <button type="submit">دخول</button>
    </form>
    <p id="loginMsg"></p>
  </div>

  <!-- البرنامج نفسه (مخفي لحد ما تسجل دخول) -->
  <div id="app" hidden>
    <button onclick="logout()" style="background:#c0392b">🚪 تسجيل خروج</button>

  <h2>إضافة عامل جديد</h2>
   <div id="scanBox">
        <button type="button" onclick="openCamera()">📷 صوّر الإقامة</button>
    <button type="button" onclick="document.getElementById('iqamaFile').click()">🖼️ اختار صورة</button>
    <input type="file" id="iqamaCamera" accept="image/*" capture="environment" onchange="scanIqama(this)" hidden>
    <input type="file" id="iqamaFile" accept="image/*" onchange="scanIqama(this)" hidden>
    <p>💡 حط الإقامة على سطح غامق، في نور كويس، وقرّب لحد ما الكارت يملا الصورة.</p>

    <span id="scanStatus"></span>
        <br><img id="iqamaPreview" hidden>
  </div>
  <form id="workerForm">
    <input id="name" placeholder="اسم العامل" required>
        <input id="idNo" placeholder="رقم الإقامة">
    <select id="country">
      <option value="">اختار البلد</option>
      <option>هندي</option>
      <option>بنجلاديشي</option>
      <option>نيبالي</option>
      <option>باكستاني</option>
      <option>مصري</option>
      <option>يمني</option>
      <option>فلبيني</option>
    </select>

    <select id="language">
      <option value="">اختار اللغة</option>
      <option>عربي</option>
      <option>إنجليزي</option>
      <option>أوردو</option>
    </select>
    <input id="room" placeholder="رقم الغرفة">
    <label>تاريخ القدوم <input id="arrival" type="date"></label>
    <select id="blanket">
      <option value="لا">لم يستلم بطانية</option>
      <option value="نعم">استلم بطانية</option>
    </select>
    
    <button type="submit">إضافة</button>
  </form>

  <h2>قائمة العمال</h2>
      <div id="stats"></div>
  <div id="filterBox">
    <input id="search" placeholder="🔍 ابحث بالاسم أو الإقامة أو الغرفة" oninput="showWorkers()">
    <select id="filterBuilding" onchange="showWorkers()">
      <option value="">كل المساكن</option>
      <option>السكن الأول</option>
      <option>السكن الثاني</option>
    </select>
    <b id="resultCount"></b>
  </div>
  <div id="workersList"></div>
  
  <h2>الملف الشخصي</h2>
  <div id="profile">اختار عامل من القائمة لعرض ملفه</div>
    <h2>النسخة الاحتياطية</h2>
  <div id="backupBox">
    <button onclick="exportData()">📥 حفظ نسخة احتياطية</button>
    <button onclick="document.getElementById('importFile').click()">📤 استرجاع من ملف</button>
    <input type="file" id="importFile" accept=".json" onchange="importData(this)" hidden>
  </div>
   <div id="cameraBox" hidden>
    <div id="cameraWrap">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div id="cameraFrame"></div>
    </div>
    <p>حط الإقامة جوه الإطار البرتقالي</p>
    <button type="button" onclick="takePhoto()">📸 التقط الصورة</button>
    <button type="button" onclick="closeCamera()" style="background:#c0392b">إلغاء</button>
  </div>
</div> <!-- نهاية app -->
    <script>
          // 0. الاتصال بـ Supabase
        const SUPABASE_URL = "https://xbckfzqifaywhrpuqkyo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FyUepLOGo7wUTpj7cdSZsg_TXi1r8bl";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // إظهار البرنامج وإخفاء شاشة الدخول
    function showApp() {
      document.getElementById("loginBox").hidden = true;
      document.getElementById("app").hidden = false;
            loadWorkers();
    }

    // تسجيل الدخول
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const msg = document.getElementById("loginMsg");
      msg.textContent = "⏳ جاري الدخول...";

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value
      });

      if (error) {
        msg.textContent = "❌ الإيميل أو الباسورد غلط";
        return;
      }
      msg.textContent = "";
      showApp();
    });

    // تسجيل الخروج
    async function logout() {
      await db.auth.signOut();
      location.reload();
    }

    // لو مسجّل دخول من قبل، افتح البرنامج على طول
    db.auth.getSession().then(function ({ data }) {
      if (data.session) showApp();
    });
    // 1. نجيب العمال المحفوظين، ولو مفيش نبدأ بقائمة فاضية
    let workers = [];

    // نجيب العمال من Supabase
    async function loadWorkers() {
      const { data, error } = await db.from("workers").select("*").order("building").order("room").order("bed_no");
      if (error) {
        alert("❌ مشكلة في تحميل العمال: " + error.message);
        return;
      }
      workers = data.map(w => ({ ...w, idNo: w.id_no, iqamaImg: w.iqama_img }));
      showWorkers();
    }

    // 2. دالة بتعرض العمال في الصفحة
          // كروت الأرقام
    function showStats() {
      const b1 = workers.filter(w => w.building === "السكن الأول").length;
      const b2 = workers.filter(w => w.building === "السكن الثاني").length;
      const blanket = workers.filter(w => w.blanket === "نعم").length;
      const noImg = workers.filter(w => !w.iqamaImg).length;

      document.getElementById("stats").innerHTML = `
        <div class="stat"><b>${workers.length}</b>إجمالي الساكنين</div>
        <div class="stat"><b>${b1}</b>السكن الأول</div>
        <div class="stat"><b>${b2}</b>السكن الثاني</div>
        <div class="stat"><b>${blanket}</b>استلموا بطانية</div>
        <div class="stat"><b style="color:#c0392b">${noImg}</b>بدون صورة إقامة</div>
      `;
    }
       function showWorkers() {
      const list = document.getElementById("workersList");
      const q = document.getElementById("search").value.trim().toLowerCase();
      const b = document.getElementById("filterBuilding").value;

      // نختار العمال اللي مطابقين البحث والسكن
      const result = workers.filter(function (w) {
        if (b && w.building !== b) return false;
        if (!q) return true;
        const text = (w.name + " " + (w.idNo || "") + " " + (w.room || "")).toLowerCase();
        return text.includes(q);
      });

      document.getElementById("resultCount").textContent = "العدد: " + result.length;

      if (result.length === 0) {
        list.innerHTML = "<p>لا يوجد نتائج</p>";
        return;
      }

            let html = `<div><table>
        <tr><th>#</th><th>الاسم</th><th>السكن</th><th>الغرفة</th><th>السرير</th><th>الإقامة</th><th>الجنسية</th><th>المهنة</th><th>البطانية</th><th>صورة الإقامة</th><th></th></tr>`;

      result.slice(0, 50).forEach(function (worker, i) {
        html += `<tr>
          <td>${i + 1}</td>
          <td><b>${worker.name}</b></td>
          <td>${worker.building || "-"}</td>
          <td>${worker.room || "-"}</td>
          <td>${worker.bed_no || "-"}</td>
          <td>${worker.idNo || "-"}</td>
          <td>${worker.country || "-"}</td>
          <td>${worker.job || "-"}</td>
          <td>${worker.blanket === "نعم" ? '<span class="badge ok">استلم</span>' : '<span class="badge bad">لم يستلم</span>'}</td>
          <td>${worker.iqamaImg ? '<span class="badge ok">موجودة</span>' : '<span class="badge miss">ناقصة</span>'}</td>
          <td>
            <button onclick="showProfile(${worker.id})">الملف</button>
            <button onclick="deleteWorker(${worker.id})" style="background:#c0392b">حذف</button>
          </td>
        </tr>`;
      });

      html += `</table></div>`;
      if (result.length > 50) {
        html += `<p>معروض أول 50 من ${result.length}. اكتب في البحث عشان تضيّق النتيجة.</p>`;
      }
      list.innerHTML = html;
    }
    // 3. لما ندوس زرار "إضافة"
    document.getElementById("workerForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const form = event.target;

      const worker = {
        name: document.getElementById("name").value,
        id_no: document.getElementById("idNo").value,
        country: document.getElementById("country").value,
        language: document.getElementById("language").value,
        room: document.getElementById("room").value,
        arrival: document.getElementById("arrival").value || null,
        blanket: document.getElementById("blanket").value
      };

            // رفع صورة الإقامة لو موجودة
      if (lastIqamaImage) {
        const blob = await (await fetch(lastIqamaImage)).blob();
        const path = Date.now() + ".jpg";
        const { error: upErr } = await db.storage.from("iqama").upload(path, blob, { contentType: "image/jpeg" });
        if (upErr) {
          alert("❌ الصورة مترفعتش: " + upErr.message);
          return;
        }
        worker.iqama_img = path;
      }
      
      const { error } = await db.from("workers").insert(worker);
      if (error) {
        alert("❌ العامل متحفظش: " + error.message);
        return;
      }

      form.reset();
      lastIqamaImage = "";
      document.getElementById("iqamaPreview").hidden = true;
      loadWorkers();
    });
    
       // 6. الملف الشخصي (بيانات السكن)
        async function showProfile(workerId) {
      const worker = workers.find(w => w.id === workerId);
      // نجيب رابط مؤقت للصورة
      let imgUrl = "";
      if (worker.iqamaImg) {
        const { data } = await db.storage.from("iqama").createSignedUrl(worker.iqamaImg, 3600);
        if (data) imgUrl = data.signedUrl;
      }
      document.getElementById("profile").innerHTML = `
        <h3>${worker.name}</h3>
        ${imgUrl ? `<img src="${imgUrl}" class="iqama-img"><br>` : ""}
        رقم الإقامة: ${worker.idNo || "-"}<br>
        البلد: ${worker.country}<br>
        اللغة: ${worker.language}

        <h4>بيانات السكن</h4>
        رقم الغرفة: ${worker.room || "-"}<br>
        تاريخ القدوم: ${worker.arrival || "-"}<br>
        استلم بطانية: ${worker.blanket || "لا"}
      `;
    }
     
    
    // 7. النسخة الاحتياطية: حفظ البيانات في ملف
    function exportData() {
      const data = { workers: workers };
      const text = JSON.stringify(data);
      const file = new Blob([text], { type: "application/json" });

      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = "backup-" + new Date().toISOString().slice(0, 10) + ".json";
      link.click();
    }

    // استرجاع البيانات من ملف
    function importData(input) {
      const file = input.files[0];
      if (!file) return;

      if (!confirm("البيانات الحالية هتتبدّل بالبيانات اللي في الملف. متأكد؟")) {
        input.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function () {
        const data = JSON.parse(reader.result);
        workers = data.workers || [];
        localStorage.setItem("workers", JSON.stringify(workers));
        showWorkers();
              showStats();
        input.value = "";
        alert("تم استرجاع البيانات بنجاح ✅");
      };
      reader.readAsText(file);
    }
      // 8. قراءة صورة الإقامة
    const countries = {
      "هندي": ["الهند", "INDIA"],
      "بنجلاديشي": ["بنجلاديش", "بنغلاديش", "BANGLADESH"],
      "نيبالي": ["نيبال", "NEPAL"],
      "باكستاني": ["باكستان", "PAKISTAN"],
      "مصري": ["مصر", "EGYPT"],
      "يمني": ["اليمن", "YEMEN"],
      "فلبيني": ["الفلبين", "PHILIPPINES"]
    };
    // الصورة الأخيرة اللي اتقرت
    let lastIqamaImage = "";

    // تصغير الصورة عشان متاخدش مساحة كبيرة
    function resizeImage(file) {
      return new Promise(function (resolve) {
        const img = new Image();
        img.onload = function () {
          const scale = Math.min(1, 800 / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = URL.createObjectURL(file);
      });
    }
    async function scanIqama(input) {
      const file = input.files[0];
      if (!file) return;
      
      lastIqamaImage = await resizeImage(file);
      const preview = document.getElementById("iqamaPreview");
      preview.src = lastIqamaImage;
      preview.hidden = false;

      const status = document.getElementById("scanStatus");
      status.textContent = "⏳ جاري قراءة الصورة... استنى شوية";

      try {
        const result = await Tesseract.recognize(file, "ara+eng");
        const text = result.data.text;
        console.log(text);

        // رقم الإقامة: 10 أرقام بتبدأ بـ 2
        const idMatch = text.match(/2\d{9}/);
        if (idMatch) {
          document.getElementById("idNo").value = idMatch[0];
}
                // الاسم: أطول سطر فيه حروف إنجليزي كبيرة
        const ignore = ["KINGDOM", "SAUDI", "ARABIA", "MINISTRY", "INTERIOR", "RESIDENT", "IDENTITY", "PERMIT"];
        let bestName = "";

        text.split("\n").forEach(function (line) {
          const clean = line
            .replace(/[^A-Z ]/g, "")
            .split(" ")
            .filter(w => w.length >= 2)
            .join(" ");

          const isIgnored = ignore.some(w => clean.includes(w));
          const words = clean.split(" ").length;

          if (!isIgnored && words >= 2 && clean.length > bestName.length) {
            bestName = clean;
          }
        });

        if (bestName) {
          document.getElementById("name").value = bestName;
        }
        
       

        // البلد
        const upperText = text.toUpperCase();
        for (const key in countries) {
          if (countries[key].some(w => upperText.includes(w))) {
            document.getElementById("country").value = key;
          }
        }

        status.textContent = "✅ خلصت القراءة، راجع البيانات قبل ما تدوس إضافة";
      } catch (error) {
        status.textContent = "❌ معرفتش أقرا الصورة، اتأكد إنك متصل بالإنترنت";
      }

      input.value = "";
    }
    
        // 10. الكاميرا بإطار
    let cameraStream = null;

    async function openCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        document.getElementById("cameraVideo").srcObject = cameraStream;
        document.getElementById("cameraBox").hidden = false;
      } catch (e) {
        alert("❌ الكاميرا مفتحتش. اسمح للموقع يستخدم الكاميرا، أو استخدم زرار اختار صورة");
      }
    }

    function closeCamera() {
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
      document.getElementById("cameraBox").hidden = true;
    }

    function takePhoto() {
      const video = document.getElementById("cameraVideo");
      const v = video.getBoundingClientRect();
      const f = document.getElementById("cameraFrame").getBoundingClientRect();
      const scale = video.videoWidth / v.width;

      const canvas = document.createElement("canvas");
      canvas.width = f.width * scale;
      canvas.height = f.height * scale;
      canvas.getContext("2d").drawImage(
        video,
        (f.left - v.left) * scale, (f.top - v.top) * scale, canvas.width, canvas.height,
        0, 0, canvas.width, canvas.height
      );

      closeCamera();
      canvas.toBlob(function (blob) {
        scanIqama({ files: [blob], value: "" });
      }, "image/jpeg", 0.92);
    }
    
        // 9. حذف عامل
    async function deleteWorker(workerId) {
      const worker = workers.find(w => w.id === workerId);
      if (!confirm("متأكد إنك عايز تحذف " + worker.name + "؟")) return;

      const { error } = await db.from("workers").delete().eq("id", workerId);
      if (error) {
        alert("❌ محصلش حذف: " + error.message);
        return;
      }
      if (worker.iqamaImg) await db.storage.from("iqama").remove([worker.iqamaImg]);
     
      document.getElementById("profile").innerHTML = "اختار عامل من القائمة لعرض ملفه";
      loadWorkers();
    }
     // 4. أول ما الصفحة تفتح، اعرض العمال
    showWorkers();
      
  </script>

</body>
</html>
